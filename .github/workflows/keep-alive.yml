name: Ping diário ao Supabase

# Os projetos Supabase no plano gratuito entram em pausa ao fim de alguns dias
# sem atividade, e reativá-los é manual. Um pedido por dia à API evita isso.
#
# O pedido vai direto ao PostgREST do Supabase, sem passar pela aplicação: é o
# caminho mais curto e não depende de a app estar de pé. Usa a chave anónima,
# que já é pública (NEXT_PUBLIC_SUPABASE_ANON_KEY) — a RLS devolve zero linhas,
# mas a consulta chega ao Postgres, que é o que conta como atividade.
#
# Não está na Vercel porque o plano Hobby permite 2 cron jobs por projeto e
# ambos já estão ocupados (poll-mailboxes e erp-retry).

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: # permite disparar à mão no separador Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingar a base de dados
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ]; then
            echo "::error::Falta a variável SUPABASE_URL (Settings › Secrets and variables › Actions › Variables)"
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Falta o segredo SUPABASE_ANON_KEY (Settings › Secrets and variables › Actions › Secrets)"
            exit 1
          fi

          # --fail faz o curl devolver erro em qualquer resposta HTTP >= 400,
          # por isso o passo só passa se a base de dados respondeu mesmo.
          codigo=$(curl --silent --show-error --fail --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/invoices?select=id&limit=1")

          echo "Base de dados respondeu HTTP ${codigo}. Projeto mantido ativo."
